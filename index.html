<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src='script.js' defer></script>
    <title>Quizz idées reçues</title>
</head>

<body>
    <header>
        <h1>Démystificateur</h1>
    </header>

    <main>
        <section class="zoneTitre">
            <h2>Teste tes certitudes… et accepte de te faire contredire 😌</h2>
            <p>Ce quiz met ton esprit critique à l’épreuve.
                Une affirmation.
                Un choix.
                Une explication claire (et parfois surprenante).</p>
        </section>

        <section class="zoneJeu">
            <div class='zoneQuestion'>
                <span>Question</span>
            </div>

            <div class='zoneExplication'>
                <p>**explication de l'idée reçue</p>
            </div>
            <form action="" method="get" class="formulaire">
                <button type="button" id="buttonTrue" class='buttonStyle'>Vrai</button>
                <button type="button" id="buttonFalse" class='buttonStyle'>Faux</button>
            </form>

            <button type="button" class="bouttonSuivant buttonStyle">Continuer </button>




            <div class="zoneScore">
                Votre score : <span>0</span>
            </div>
        </section>
    </main>

    <footer>
        <p>@Copyright : Grd.production</p>
    </footer>

</body>

</html>
